# The static site, served.
#
# Installed as /etc/nginx/conf.d/default.conf by the Dockerfile, replacing the
# stock server block rather than sitting beside it.
#
# 8080 and not 80: the base image is nginx-unprivileged, the process runs as uid
# 101, and binding a port below 1024 would need a capability this container does
# not have and does not want.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The version banner tells a scanner which nginx to look up CVEs for and
    # tells a reader nothing.
    server_tokens off;

    # The security headers are NOT declared here, on purpose, and the reason is
    # worth knowing before adding one: nginx's add_header does not merge into a
    # location that sets an add_header of its own, so anything written at this
    # level would be served on exactly the locations below that set no caching
    # header, which is one of five. They live in nginx-security.conf and every
    # location includes it.

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    # 1 is nearly all of the ratio for a fraction of the CPU, and these files
    # compress on every request because none of them is stored precompressed.
    gzip_comp_level 5;
    # Below about a packet there is nothing to win, and a gzip header is 18 bytes.
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
    # text/html is compressed unconditionally by nginx and naming it here logs a
    # warning on start-up, so it is deliberately absent from that list.

    # ---------------------------------------------------------------------
    # Liveness
    # ---------------------------------------------------------------------

    # Answered by nginx itself, with no filesystem access and no upstream, so it
    # reports on this server and nothing else. Out of the access log because a
    # 30-second health check would otherwise be most of the log.
    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        # `default_type` and not `add_header Content-Type`: a `return` already
        # sets one (application/octet-stream), and add_header appends rather than
        # replaces, so the response went out with two Content-Type headers.
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # Runtime configuration
    # ---------------------------------------------------------------------

    # `no-store`, and this is the header the whole runtime-configuration feature
    # rests on. Without it an operator edits config.json, reloads, and is served
    # their old configuration out of the browser's cache — which is the exact
    # failure the feature exists to remove, arriving by a different road.
    #
    # `no-store` rather than `no-cache`: no-cache permits storing the response and
    # revalidating it, which is fine until a proxy in between decides an ETag match
    # is good enough. There is one small file here and nothing to gain by keeping
    # any copy of it.
    #
    # 404 is a supported answer, not an error: lib/runtime-config.ts treats an
    # absent file as "use the compiled-in defaults", which is how the public
    # deployment runs.
    location = /config.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # No Content-Type here: mime.types already resolves .json, and add_header
        # appends rather than replaces, so setting it sent the header twice.
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Cache policy
    # ---------------------------------------------------------------------

    # Content-addressed by the bundler: the file name changes whenever the bytes
    # do, so a copy can be kept forever and never revalidated. `immutable` is what
    # stops a browser issuing a conditional request for a file that cannot have
    # changed.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # MapLibre's worker, and NOT immutable, which is the important part.
    #
    # scripts/copy-maplibre-worker.mjs copies these out of node_modules under
    # their own fixed names — the file has to keep its name, because it imports
    # maplibre-gl-shared.mjs relatively. A fixed name is the one case where
    # `immutable` is actively wrong: it would pin one release's worker in a
    # reader's cache for a year and hand it a newer bundle to run against.
    #
    # `no-cache` still allows the copy to be kept; it requires it to be revalidated,
    # which costs a 304 and is correct.
    location /maplibre/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---------------------------------------------------------------------
    # Documents and the client-side fallback
    # ---------------------------------------------------------------------

    location / {
        include /etc/nginx/security-headers.conf;

        # `no-cache` on the documents, so a deployment is visible on the next
        # reload. The document is what names the hashed assets above, so caching
        # it is what would keep a reader on the previous release entirely.
        add_header Cache-Control "no-cache" always;

        # The SPA fallback. `$uri.html` before the fallback because the static
        # export writes /404.html and /_not-found.html as real files and a request
        # for /404 should find one.
        #
        # The fallback answers 200 and not 404 deliberately: a client-side route
        # typed into the address bar or arriving from a shared link is a valid
        # address for this application, and 404 would make the browser show its own
        # error page instead of letting the app route it.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
