# Response headers that are the same for every build, and the policy that is not.
#
# Installed as /etc/nginx/security-headers.conf by the Dockerfile and included
# from every location block in nginx.conf.
#
# Included rather than declared once at the server level, and that is not
# style. nginx's add_header does not merge: a location block that sets any
# add_header of its own discards every one inherited from the server, silently.
# Four of the five locations here set Cache-Control, so a Content-Security-Policy
# written once at the top would be served on none of them. Including the same
# file everywhere is the version of this that cannot be got wrong by adding a
# location later.
#
# The values live in scripts/security-headers.mjs, which emits the same set into
# out/_headers for Cloudflare Pages. Change them there, not here: this file is a
# transcription and the generator is the original.

# Content-Type is what it says it is. Without this a .json a self-hoster mounted
# with the wrong extension can be sniffed into something executable.
add_header X-Content-Type-Options "nosniff" always;

# Nothing leaves with the address of the page it left from.
#
# The reason is the constitution rather than hygiene: every request to the
# geocoder and the router would otherwise carry a Referer, and a rider's
# destination is supposed to stay in their browser. The URL holds nothing today.
# The day a shared-plan link exists, this is already in place.
add_header Referrer-Policy "no-referrer" always;

# Superseded by frame-ancestors below for anything current, kept for what is not.
add_header X-Frame-Options "DENY" always;

# Position is asked for by this document and by nothing it embeds. Everything
# else is refused outright rather than left at the browser's default.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

# The Content-Security-Policy, generated at build time because it carries the
# hash of every inline script this build emitted. See the header of
# scripts/security-headers.mjs for why it cannot be written by hand.
include /etc/nginx/csp.conf;
