name: Publish container image

# One image, several names.
#
# The self-hosting image only (see the header of the Dockerfile): the public
# deployment is Cloudflare Pages serving the static export and no container is
# involved in it. Nothing here deploys anything.
#
# Not on `pull_request`, deliberately. A pull request from a fork gets a read-only
# token, so a publish step on it would fail for every outside contributor —
# noisily, and with nothing they could do about it. The build itself is covered by
# ci.yml on the same commit; what happens here is the push, and only for refs that
# already exist in this repository.
on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The one write this workflow needs, and the reason permissions are declared
  # here rather than left at the repository default.
  packages: write

env:
  REGISTRY: ghcr.io
  # `github.repository` is already lowercase for this repository. It is passed
  # through `tr` below anyway, because a registry rejects an uppercase path and an
  # owner who renames themselves should not discover that here.
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lowercase the image name
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # arm64 is emulated on an amd64 runner, which is why it is here. The build
      # stage compiles TypeScript under emulation and is the slow half; the cache
      # below is what keeps that from being paid on every push.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The token the runner already has. No secret to create, and it cannot
          # reach anything but this repository's packages.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every tag this artefact answers to, decided in one place.
      #
      #   main            -> latest
      #   dev             -> dev
      #   v1.2.3          -> 1.2.3, 1.2, 1
      #   any of the above -> sha-<short>
      #
      # The moving names and the fixed ones both point at one build. `latest` is
      # pinned to main explicitly rather than through `is_default_branch`, so that
      # renaming the default branch is a decision somebody makes here rather than
      # a side effect.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          # `type=semver,pattern={{major}}` is suppressed below 1.0 on purpose: a
          # `0` tag that slides across 0.1 and 0.2 promises a compatibility this
          # project has not offered yet, and semver says those minors may break.
          labels: |
            org.opencontainers.image.title=Redock
            org.opencontainers.image.description=Bike-share trip planner that splits a ride into segments short enough to stay inside the free window
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Actions cache, shared across runs of this workflow. `mode=max`
          # keeps the intermediate layers too, which is what makes `npm ci` in the
          # build stage a cache hit — the expensive step, paid twice per run
          # because of the second architecture.
          cache-from: type=gha
          cache-to: type=gha,mode=max
